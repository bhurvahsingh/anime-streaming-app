<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Lightweight Anime Streaming App">
    <title>AnimeHub - Streaming</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1e;
            color: #e0e0e0;
            line-height: 1.5;
            overflow-x: hidden;
        }
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --dark: #1a1a2e;
        }
        .header {
            background: linear-gradient(135deg, var(--dark) 0%, #16213e 100%);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .logo {
            font-size: 18px;
            font-weight: bold;
            color: var(--primary);
            text-decoration: none;
        }
        .search-bar {
            flex: 1;
            max-width: 300px;
            margin: 0 15px;
        }
        .search-bar input {
            width: 100%;
            padding: 8px 12px;
            border: none;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
            font-size: 14px;
        }
        .search-bar input::placeholder {
            color: rgba(224,224,224,0.5);
        }
        .nav-icons {
            display: flex;
            gap: 15px;
        }
        .nav-icons button {
            background: none;
            border: none;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }
        .container {
            max-width: 100%;
            padding: 15px;
            margin-top: 10px;
        }
        .home-section h2 {
            font-size: 18px;
            margin: 20px 0 10px;
            color: var(--primary);
        }
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .anime-card {
            background: #16213e;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .anime-card:active {
            transform: scale(0.98);
            box-shadow: 0 4px 12px rgba(255,107,107,0.3);
        }
        .anime-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #0f0f1e;
            display: block;
        }
        .anime-card-info {
            padding: 8px;
        }
        .anime-card-title {
            font-size: 12px;
            font-weight: 600;
            color: #e0e0e0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .anime-card-meta {
            font-size: 10px;
            color: rgba(224,224,224,0.6);
            margin-top: 4px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #16213e;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(224,224,224,0.1);
            z-index: 50;
        }
        .bottom-nav button {
            background: none;
            border: none;
            color: rgba(224,224,224,0.6);
            cursor: pointer;
            padding: 10px 20px;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .bottom-nav button.active {
            color: var(--primary);
        }
        main {
            padding-bottom: 70px;
        }
        .spinner {
            border: 3px solid rgba(224,224,224,0.1);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (min-width: 768px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            .anime-card img {
                height: 220px;
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <header class="header">
            <a href="/" class="logo">🎬 AnimeHub</a>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search anime...">
            </div>
            <div class="nav-icons">
                <button id="notificationBtn">🔔</button>
                <button id="userMenuBtn">👤</button>
            </div>
        </header>

        <main class="container">
            <section class="home-section">
                <h2>🔥 Trending Now</h2>
                <div id="trendingGrid" class="anime-grid"></div>
            </section>

            <section class="home-section">
                <h2>✨ Recommended</h2>
                <div id="recommendedGrid" class="anime-grid"></div>
            </section>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-page="home">🏠 Home</button>
            <button class="nav-item" data-page="search">🔍 Search</button>
            <button class="nav-item" data-page="watchlist">📚 List</button>
            <button class="nav-item" data-page="profile">👤 Profile</button>
        </nav>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed'));
        }

        const API_URL = '/api';

        async function loadTrending() {
            try {
                const res = await fetch(`${API_URL}/anime/trending`);
                const anime = await res.json();
                renderAnimeGrid('trendingGrid', anime);
            } catch (err) {
                console.error('Error loading trending:', err);
            }
        }

        function renderAnimeGrid(elementId, anime) {
            const grid = document.getElementById(elementId);
            grid.innerHTML = anime.map(a => `
                <div class="anime-card" onclick="viewAnime(${a.id})">
                    <img src="${a.thumbnail_url || '/placeholder.jpg'}" alt="${a.title}" loading="lazy">
                    <div class="anime-card-info">
                        <div class="anime-card-title">${a.title}</div>
                        <div class="anime-card-meta">${a.total_episodes || '?'} eps</div>
                    </div>
                </div>
            `).join('');
        }

        function viewAnime(id) {
            window.location.href = `/watch/${id}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadTrending();
        });

        document.getElementById('searchInput').addEventListener('input', async (e) => {
            const query = e.target.value.trim();
            if (query.length < 2) return;
            try {
                const res = await fetch(`${API_URL}/anime/search/query?q=${encodeURIComponent(query)}`);
                const results = await res.json();
                renderAnimeGrid('trendingGrid', results);
            } catch (err) {
                console.error('Search error:', err);
            }
        });

        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
            });
        });
    </script>
</body>
</html>
